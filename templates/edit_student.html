{% extends 'base.html' %}{% block title %}Edit Student · Smart Attendance{% endblock %}{% block page_heading %}Edit Student{% endblock %}
{% block content %}<div class="back-link"><a href="{{ url_for('students') }}">← Back to students</a></div><div class="panel form-panel narrow-form"><div class="panel-heading"><div><h3>Update student details</h3><p>Student ID cannot be changed because it links attendance and face data.</p></div></div><form method="post" class="stack-form"><label>Student ID</label><input value="{{ student.student_id }}" disabled><label for="name">Full name *</label><input id="name" name="name" value="{{ student.name }}" required><label for="email">Email address</label><input id="email" name="email" type="email" value="{{ student.email or '' }}"><button class="btn primary" type="submit">Save changes</button></form></div>{% endblock %}
